[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "susurro-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "mlx-audio==0.4.2",
    "mlx==0.31.2",
    "lingua-language-detector",
    "numpy",
    "soundfile",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/susurro_backend"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (loads the TTS model, ~1.7 GB). Run with: pytest -m slow",
]
