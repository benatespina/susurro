name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0 or v0.1.0) — release step is skipped for manual runs'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      # macos-15 ships Xcode 16; Susurro targets macOS 26 (Tahoe) SDK.
      # Use the latest Xcode available on the runner until GitHub provides macos-26.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # Log Xcode version after selection so build failures from a wrong SDK are obvious
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build archive
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          xcodebuild archive \
            -project Susurro.xcodeproj \
            -scheme Susurro \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Susurro.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            MARKETING_VERSION="$VERSION" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO

      - name: Export app from archive
        run: |
          # xcodebuild -exportArchive no longer accepts method=mac-application in Xcode 26.
          # The .app is already signed during archive; copy it directly from the archive products.
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/Susurro.xcarchive/Products/Applications/Susurro.app" \
                "$RUNNER_TEMP/export/Susurro.app"

      - name: Verify ad-hoc signature
        run: |
          # Informational only — does not fail the build
          codesign -dv "$RUNNER_TEMP/export/Susurro.app" || true

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # create-dmg requires a signing identity that is not available on CI runners.
          # Use hdiutil directly to produce an unsigned DMG (adequate for ad-hoc distribution).
          hdiutil create \
            -volname "Susurro" \
            -srcfolder "$RUNNER_TEMP/export/Susurro.app" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/Susurro-${VERSION}.dmg"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "v${VERSION}" \
            --title "Susurro v${VERSION}" \
            --generate-notes \
            "$RUNNER_TEMP/Susurro-${VERSION}.dmg"
