name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (without leading v)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # macos-15 ships Xcode 16; Susurro targets macOS 26 (Tahoe) SDK.
      # Use the latest Xcode available on the runner until GitHub provides macos-26.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # Log Xcode version after selection so build failures from a wrong SDK are obvious
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEV_CERT_P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_DEV_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/Susurro.provisionprofile"
          # Surface profile metadata so build logs make expiry obvious.
          security cms -D -i "$PROFILE_DIR/Susurro.provisionprofile" | \
            plutil -extract Name raw - || true
          security cms -D -i "$PROFILE_DIR/Susurro.provisionprofile" | \
            plutil -extract ExpirationDate raw - || true

      - name: Build archive
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          xcodebuild archive \
            -project Susurro.xcodeproj \
            -scheme Susurro \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Susurro.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Development: benatespina@gmail.com (5AJ5S5GA7D)" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=CCL5FH83TC \
            PROVISIONING_PROFILE_SPECIFIER="Mac Team Provisioning Profile: com.benatespina.susurro" \
            MARKETING_VERSION="$VERSION" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO

      - name: Export app from archive
        run: |
          # xcodebuild -exportArchive no longer accepts method=mac-application in Xcode 26.
          # The .app is already signed during archive; copy it directly from the archive products.
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/Susurro.xcarchive/Products/Applications/Susurro.app" \
                "$RUNNER_TEMP/export/Susurro.app"

      - name: Verify signature
        run: |
          codesign -dv --verbose=2 "$RUNNER_TEMP/export/Susurro.app"
          codesign -d --entitlements - "$RUNNER_TEMP/export/Susurro.app" || true

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # create-dmg requires a signing identity that is not available on CI runners.
          # Use hdiutil directly to produce an unsigned DMG (adequate for ad-hoc distribution).
          # Stage the app and Applications symlink together, then create the DMG.
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$RUNNER_TEMP/export/Susurro.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Susurro" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/Susurro-${VERSION}.dmg"

      - name: Compute SHA256 and create stable alias
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "Susurro-${VERSION}.dmg" > "Susurro-${VERSION}.dmg.sha256"
          cp "Susurro-${VERSION}.dmg" "Susurro.dmg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes-template.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "v${VERSION}" \
            --title "Susurro v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target main \
            "$RUNNER_TEMP/Susurro-${VERSION}.dmg" \
            "$RUNNER_TEMP/Susurro-${VERSION}.dmg.sha256" \
            "$RUNNER_TEMP/Susurro.dmg"

      - name: Bump Homebrew Cask
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256=$(awk '{print $1}' "$RUNNER_TEMP/Susurro-${VERSION}.dmg.sha256")
          sed -i.bak -E "s/^  version \".*\"$/  version \"${VERSION}\"/" Casks/susurro.rb
          sed -i.bak -E "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" Casks/susurro.rb
          rm -f Casks/susurro.rb.bak

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/susurro.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(cask): bump to v${VERSION}"
          git push origin HEAD:main
