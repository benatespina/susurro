name: Susurro
options:
  bundleIdPrefix: com.benatespina
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Susurro Dev"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  Susurro:
    type: application
    platform: macOS
    sources:
      - path: Susurro
        excludes:
          - "**/*Tests.swift"
    info:
      path: Susurro/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAccessibilityUsageDescription: "Susurro needs Accessibility access to detect text selection in other apps so it can read the selected text aloud."
        NSHumanReadableCopyright: "© 2026 Beñat Espiña"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Susurro/Susurro.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - target: SusurroCLI
        link: false
        embed: false
    postBuildScripts:
      - name: "Embed susurro CLI"
        script: |
          BIN_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin"
          mkdir -p "${BIN_DIR}"
          cp "${BUILT_PRODUCTS_DIR}/susurro" "${BIN_DIR}/susurro"
          codesign --force --sign "${CODE_SIGN_IDENTITY}" "${BIN_DIR}/susurro"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benatespina.susurro
        GENERATE_INFOPLIST_FILE: NO
  SusurroCLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
        excludes:
          - "**/*Tests.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benatespina.susurro.cli
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: susurro
        SWIFT_MODULE_NAME: SusurroCLI
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
  SusurroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Susurro
        includes:
          - "**/*Tests.swift"
      - path: CLI
        includes:
          - "Version.swift"
          - "IPCClient.swift"
          - "CLITests.swift"
    dependencies:
      - target: Susurro
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Susurro.app/Contents/MacOS/Susurro"
        PRODUCT_BUNDLE_IDENTIFIER: com.benatespina.susurrotests
