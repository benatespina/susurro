name: Susurro
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
options:
  bundleIdPrefix: com.benatespina
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CCL5FH83TC
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
targets:
  Susurro:
    type: application
    platform: macOS
    sources:
      - path: Susurro
        excludes:
          - "**/*Tests.swift"
      - path: Susurro/Resources/Readability.js
        buildPhase: resources
      - path: Susurro/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Susurro/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAccessibilityUsageDescription: "Susurro needs Accessibility access to detect text selection in other apps so it can read the selected text aloud."
        NSUserNotificationUsageDescription: "Susurro notifies you when a new version is available."
        NSHumanReadableCopyright: "© 2026 Beñat Espiña"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.benatespina.susurro.oauth
            CFBundleURLSchemes:
              - com.benatespina.susurro
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benatespina.susurro
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Susurro/Susurro.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Susurro/Susurro-Release.entitlements
  SusurroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Susurro
        includes:
          - "**/*Tests.swift"
          - "**/*TestDoubles.swift"
      - path: Susurro/Resources/test-fixtures
        buildPhase: resources
    dependencies:
      - target: Susurro
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Susurro.app/Contents/MacOS/Susurro"
        PRODUCT_BUNDLE_IDENTIFIER: com.benatespina.susurrotests
